name: Docker Build and Push CPA

on:
  workflow_dispatch:
    inputs:
      cpa_plus_version:
        description: "CLIProxyAPIPlus 版本, 留空自动获取最新版"
        required: false
        type: string

      cpa_version:
        description: "CLIProxyAPI 版本, 留空自动获取最新版"
        required: false
        type: string

      #cpa_fork_version:
      #  description: "CLIProxyAPI linuxDo BenjaminAaron 的魔改版本, 留空自动获取最新版"
      #  required: false
      #  type: string

      rebuild_strategy:
        description: "当 GHCR 中已存在该版本时的处理策略"
        required: true
        type: choice
        options:
          - "force"
          - "skip"

env:
  # 统一配置所有需要下载的仓库及其行为
  # key: 唯一标识，用于 TAG 拼接等
  # repo: GitHub 仓库
  # input: 对应 workflow_dispatch 的版本输入名
  # binary: 解压后期望找到的二进制文件名（必须存在）
  # target: 最终复制到 bin/<arch>/ 和 /app/ 中的文件名
  # mode: entrypoint 中的模式名
  # default: 是否为默认模式（仅允许一个 true）
  REPOSITORIES: |
    [
      {
        "key": "cpa",
        "repo": "router-for-me/CLIProxyAPI",
        "input": "cpa_version",
        "binary": "cli-proxy-api",
        "target": "cli-proxy-api",
        "mode": "cpa",
        "default": true
      },
      {
        "key": "cpap",
        "repo": "router-for-me/CLIProxyAPIPlus",
        "input": "cpa_plus_version",
        "binary": "cli-proxy-api-plus",
        "target": "cli-proxy-api-plus",
        "mode": "cpap",
        "default": false
      }
    ]
  # {
  #  "key": "cpa-fork",
  #  "repo": "Arron196/CLIProxyAPI",
  #  "input": "cpa_fork_version",
  #  "binary": "cli-proxy-api",
  #  "target": "cli-proxy-api-fork",
  #  "mode": "cpa-fork",
  #  "default": false
  # }

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout self repo
        uses: actions/checkout@v4

      ###########################################################################
      # 生成 entrypoint.sh 和 Dockerfile（基于配置 REPOSITORIES）
      ###########################################################################
      - name: Generate entrypoint.sh and Dockerfile
        run: |
          set -e

          REPOS_JSON="$REPOSITORIES"

          # 校验配置 JSON
          echo "$REPOS_JSON" | jq . >/dev/null 2>&1 || { echo "REPOSITORIES 不是合法 JSON"; exit 1; }

          DEFAULT_MODE=$(echo "$REPOS_JSON" | jq -r '.[] | select(.default==true) | .mode' || true)
          if [ -z "$DEFAULT_MODE" ] || [ "$DEFAULT_MODE" = "null" ]; then
            echo "未在 REPOSITORIES 中找到 default=true 的配置项"
            exit 1
          fi

          # 生成 entrypoint.sh
          cat > entrypoint.sh << 'EOF'
          #!/bin/sh
          set -e

          # 初始化配置文件到挂载卷
          if [ ! -f /app/datas/config.yaml ]; then
              echo "初始化配置文件：将默认配置复制到挂载卷"
              cp /app/config.default.yaml /app/datas/config.yaml
          else
              echo "检测到已有配置文件，跳过初始化"
          fi
          ln -sf /app/datas/config.yaml /app/config.yaml

          MODE=""
          FIRST_ARG="$1"

          normalize_mode() {
            case "$1" in
          EOF

          # 默认模式：空字符串映射到默认模式
          echo "    \"\") echo \"$DEFAULT_MODE\" ;;" >> entrypoint.sh

          # 为每个仓库生成模式映射：mode 和 target 名都可作为别名
          echo "$REPOS_JSON" | jq -c '.[]' | while read -r item; do
            mode=$(echo "$item" | jq -r '.mode')
            target=$(echo "$item" | jq -r '.target')
            echo "    $mode|$target) echo \"$mode\" ;;" >> entrypoint.sh
          done

          cat >> entrypoint.sh << 'EOF'
            *)
              echo "unknown"
              ;;
            esac
          }

          if [ -n "$FIRST_ARG" ]; then
              NM=$(normalize_mode "$FIRST_ARG")
              if [ "$NM" != "unknown" ]; then
                  MODE="$NM"
                  shift
              fi
          fi

          if [ -z "$MODE" ] && [ -n "$APP_MODE" ]; then
              NM=$(normalize_mode "$APP_MODE")
              if [ "$NM" != "unknown" ]; then
                  MODE="$NM"
              fi
          fi

          if [ -z "$MODE" ]; then
          EOF

          echo "    MODE=\"$DEFAULT_MODE\"" >> entrypoint.sh

          cat >> entrypoint.sh << 'EOF'
          fi

          echo "启动模式: $MODE"

          case "$MODE" in
          EOF

          # 为每个模式生成 exec 映射
          echo "$REPOS_JSON" | jq -c '.[]' | while read -r item; do
            mode=$(echo "$item" | jq -r '.mode')
            target=$(echo "$item" | jq -r '.target')
            echo "  $mode) exec /app/$target \"\$@\" ;;" >> entrypoint.sh
          done

          cat >> entrypoint.sh << 'EOF'
            *)
              echo "未知模式: $MODE"
              exit 1
              ;;
          esac
          EOF

          chmod +x entrypoint.sh

          # 生成 Dockerfile
          cat > Dockerfile << 'EOF'
          FROM alpine:latest

          WORKDIR /app

          RUN apk add --no-cache ca-certificates tzdata

          ARG TARGETARCH
          EOF

          # 为每个二进制生成 COPY 行（使用 target 名）
          echo "$REPOS_JSON" | jq -r '.[].target' | while read -r target; do
            echo "COPY bin/\${TARGETARCH}/$target /app/$target" >> Dockerfile
          done

          cat >> Dockerfile << 'EOF'
          COPY config.yaml /app/config.default.yaml
          COPY entrypoint.sh /app/entrypoint.sh

          RUN chmod +x /app/* \
              && mkdir -p /app/datas

          EXPOSE 8317

          ENTRYPOINT ["/app/entrypoint.sh"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ###########################################################################
      # 生成 config.yaml
      ###########################################################################
      - name: Create config.yaml
        run: |
          set -e
          curl -sSL -o config.yaml "https://github.com/router-for-me/CLIProxyAPI/raw/refs/heads/main/config.example.yaml"
          sed -i \
            -e 's/^host:.*/host: "0.0.0.0"/' \
            -e 's/^\( *\)allow-remote:.*/\1allow-remote: true/' \
            -e 's/^\( *\)secret-key:.*/\1secret-key: "$2a$10$4tlNu.z8fp4XI4KDts1vTOF0pQcslHKp785KS5NQRTBKfb9sffPs."/' \
            -e 's#^\( *\)auth-dir:.*#\1auth-dir: "/app/datas/cli-proxy-api"#' \
            config.yaml

      ###########################################################################
      # 准备 bin 目录
      ###########################################################################
      - name: Prepare bin directory
        run: mkdir -p bin/amd64 bin/arm64

      ###########################################################################
      # 下载所有配置的仓库二进制，并计算最终镜像 TAG
      ###########################################################################
      - name: Download binaries and decide final image tag
        id: releases
        env:
          REPOS_JSON: ${{ env.REPOSITORIES }}
        run: |
          set -e

          echo "$REPOS_JSON" | jq . >/dev/null 2>&1 || { echo "REPOSITORIES 不是合法 JSON"; exit 1; }

          # 清理旧的 tag 文件
          rm -f tag_* || true

          # 遍历每个仓库，下载 amd64 + arm64 二进制，并记录 tag
          echo "$REPOS_JSON" | jq -c '.[]' | while read -r item; do
            key=$(echo "$item" | jq -r '.key')
            repo=$(echo "$item" | jq -r '.repo')
            input_name=$(echo "$item" | jq -r '.input')
            binary=$(echo "$item" | jq -r '.binary')
            target=$(echo "$item" | jq -r '.target')

            if [ -z "$key" ] || [ -z "$repo" ] || [ -z "$input_name" ] || [ -z "$binary" ] || [ -z "$target" ]; then
              echo "配置项缺少必要字段: key/repo/input/binary/target"
              echo "$item"
              exit 1
            fi

            # 将 input 名转换为环境变量名，例如 cpa_version -> INPUT_CPA_VERSION
            env_var="INPUT_$(echo "$input_name" | tr '[:lower:]' '[:upper:]')"
            VERSION="${!env_var}"

            if [ -z "$VERSION" ]; then
              echo "[$key] 未指定版本，获取最新 release: $repo"
              release=$(curl -s "https://api.github.com/repos/$repo/releases/latest")
            else
              echo "[$key] 指定版本: $VERSION (repo: $repo)"
              release=$(curl -s "https://api.github.com/repos/$repo/releases/tags/$VERSION")
              if echo "$release" | grep -q '"message": "Not Found"'; then
                echo "源仓库 $repo 中不存在 tag: $VERSION"
                exit 1
              fi
            fi

            TAG=$(echo "$release" | jq -r '.tag_name')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "[$key] 无法从 release 中解析 tag_name"
              echo "$release"
              exit 1
            fi

            echo "[$key] 使用 tag: $TAG"
            echo "$TAG" > "tag_${key}"

            # 下载 amd64 和 arm64 二进制
            for arch in amd64 arm64; do
              asset=$(echo "$release" | jq -r ".assets[] | select(.name | contains(\"_linux_${arch}\")) | .browser_download_url")
              if [ -z "$asset" ] || [ "$asset" = "null" ]; then
                echo "[$key] 未找到 ${arch} 对应的 linux 资产"
                exit 1
              fi

              file="${key}_${arch}.tar.gz"
              tmp_dir="tmp_${key}_${arch}"
              rm -rf "$tmp_dir"
              mkdir -p "$tmp_dir"

              echo "[$key] 下载 ${arch} 资产: $asset"
              curl -sSL -o "$file" "$asset"
              tar -xzf "$file" -C "$tmp_dir"

              if [ ! -f "${tmp_dir}/${binary}" ]; then
                echo "[$key] 解压后未找到期望的二进制文件: ${tmp_dir}/${binary}"
                echo "当前目录结构："
                ls -R "$tmp_dir" || true
                exit 1
              fi

              cp "${tmp_dir}/${binary}" "bin/${arch}/${target}"
              chmod +x "bin/${arch}/${target}"
            done
          done

          # 计算最终镜像 TAG，尽量保持与原逻辑兼容：
          # - 若存在 cpa 和 cpap：
          #   - 若 tag 相同：基础 TAG 为该 tag
          #   - 若 tag 不同：基础 TAG 为 cpa-<CPA_TAG>_cpap-<CPAP_TAG>
          # - 其他仓库（包括 cpa-fork 和未来新增）统一追加 _<key>-<tag>
          CPA_TAG=""
          CPAP_TAG=""
          if [ -f tag_cpa ]; then
            CPA_TAG=$(cat tag_cpa)
          fi
          if [ -f tag_cpap ]; then
            CPAP_TAG=$(cat tag_cpap)
          fi

          FINAL_TAG=""

          if [ -n "$CPA_TAG" ] && [ -n "$CPAP_TAG" ]; then
            if [ "$CPA_TAG" = "$CPAP_TAG" ]; then
              FINAL_TAG="$CPA_TAG"
            else
              FINAL_TAG="cpa-${CPA_TAG}_cpap-${CPAP_TAG}"
            fi
          fi

          # 在已有 FINAL_TAG 基础上追加其他仓库（排除 cpa 和 cpap）
          if [ -n "$FINAL_TAG" ]; then
            echo "$REPOS_JSON" | jq -c '.[]' | while read -r item; do
              key=$(echo "$item" | jq -r '.key')
              if [ "$key" = "cpa" ] || [ "$key" = "cpap" ]; then
                continue
              fi
              tag_file="tag_${key}"
              if [ ! -f "$tag_file" ]; then
                echo "未找到 $key 对应的 tag 文件: $tag_file"
                exit 1
              fi
              tag=$(cat "$tag_file")
              FINAL_TAG="${FINAL_TAG}_${key}-${tag}"
              echo "$FINAL_TAG" > final_tag_tmp
            done
            if [ -f final_tag_tmp ]; then
              FINAL_TAG=$(cat final_tag_tmp)
            fi
          else
            # 不存在 cpa/cpap 的情况：按配置顺序拼接 key-tag
            first=true
            echo "$REPOS_JSON" | jq -c '.[]' | while read -r item; do
              key=$(echo "$item" | jq -r '.key')
              tag_file="tag_${key}"
              if [ ! -f "$tag_file" ]; then
                echo "未找到 $key 对应的 tag 文件: $tag_file"
                exit 1
              fi
              tag=$(cat "$tag_file")
              if $first; then
                FINAL_TAG_LOCAL="${key}-${tag}"
                first=false
              else
                FINAL_TAG_LOCAL="${FINAL_TAG_LOCAL}_${key}-${tag}"
              fi
              echo "$FINAL_TAG_LOCAL" > final_tag_tmp2
            done
            if [ -f final_tag_tmp2 ]; then
              FINAL_TAG=$(cat final_tag_tmp2)
            fi
          fi

          if [ -z "$FINAL_TAG" ]; then
            echo "无法计算最终镜像 TAG"
            exit 1
          fi

          echo "最终镜像 TAG: $FINAL_TAG"
          echo "final_tag=$FINAL_TAG" >> $GITHUB_OUTPUT

      ###########################################################################
      # 构建前检查
      ###########################################################################
      - name: Pre-Build Checks
        run: |
          set -e

          echo "=== 检查 Dockerfile 是否存在 ==="
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile 不存在，生成步骤可能失败"
            exit 1
          fi

          echo "=== 检查 config.yaml 是否存在 ==="
          if [ ! -f config.yaml ]; then
            echo "config.yaml 不存在"
            exit 1
          fi

          echo "=== 检查 bin 目录结构 ==="
          ls -R bin || true

          REPOS_JSON="$REPOSITORIES"

          echo "$REPOS_JSON" | jq -r '.[].target' | while read -r target; do
            for arch in amd64 arm64; do
              if [ ! -f "bin/${arch}/${target}" ]; then
                echo "缺少二进制文件: bin/${arch}/${target}"
                exit 1
              fi
            done
          done

      ###########################################################################
      # 登录 GHCR
      ###########################################################################
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ###########################################################################
      # 检查 GHCR 中是否已存在对应 tag（单一镜像 cpa）
      ###########################################################################
      - name: Check GHCR tag for cpa
        id: check_cpa
        run: |
          set -e
          IMAGE="${{ github.repository_owner }}/cpa"
          TAG="${{ steps.releases.outputs.final_tag }}"
          STRATEGY="${{ inputs.rebuild_strategy }}"

          echo "检查 GHCR 镜像: $IMAGE:$TAG (策略: $STRATEGY)"

          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${IMAGE}/manifests/${TAG}")

          if [ "$status" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "GHCR 中已存在镜像: $IMAGE:$TAG"
            if [ "$STRATEGY" = "skip" ]; then
              echo "根据策略 skip，跳过构建"
              echo "skip_build=true" >> $GITHUB_OUTPUT
            else
              echo "根据策略 force，继续构建并覆盖"
              echo "skip_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "GHCR 中不存在镜像: $IMAGE:$TAG，将进行构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      ###########################################################################
      # 构建并推送 cpa（单一镜像）
      ###########################################################################
      - name: Build and push cpa
        if: ${{ steps.check_cpa.outputs.skip_build == 'false' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cpa:${{ steps.releases.outputs.final_tag }}
            ghcr.io/${{ github.repository_owner }}/cpa:latest

      ###########################################################################
      # 构建总结
      ###########################################################################
      - name: Build Summary
        if: ${{ steps.check_cpa.outputs.skip_build == 'true' }}
        run: |
          echo "=============================================================="
          echo "本次构建未执行镜像构建："
          echo "因为策略为 skip 且目标版本已存在。"
          echo "=============================================================="
